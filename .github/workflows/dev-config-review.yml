name: dev-config review

on:
  schedule:
    # 毎週月曜 9:30（日本時間）
    - cron: '30 0 * * 1'
  workflow_dispatch:

jobs:
  review:
    uses: takudev-works/dev-config/.github/workflows/reusable-dev-config-review.yml@fb85acb30c0c56077eb9599237a1b0d567415cb0 # v3.1.0
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      id-token: write
